[project]
name = "tendergraph"
version = "0.1.0"
description = "European tender intelligence with hybrid search and evidence-backed answers"
readme = "README.md"
authors = [
    { name = "Tanjim-hossain", email = "tanjim.hossain@student.uhasselt.be" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "numpy>=2.5.3",
    "openai>=3.19.2",
    "polars>=1.44.2",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3.6",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "sentence-transformers>=6.1.0",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "dbt-postgres==1.11.0",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
]
