name: CI

on:
  push:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.18"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Install project
        run: uv sync --frozen

      - name: Run quality gate
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          RAG_PROVIDER: evidence
        run: make check

      - name: Check browser JavaScript syntax
        run: |
          node --check tests/browser/ui_smoke.mjs
          node --check src/tendergraph/api/web/feedback.js
          node --check src/tendergraph/api/web/persistence.js
          node --check src/tendergraph/api/web/qualification.js

      - name: Verify distribution packaging
        run: make package

  persistence:
    name: Product and qualification PostgreSQL round trips
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tendergraph
          POSTGRES_USER: tendergraph
          POSTGRES_PASSWORD: tendergraph-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tendergraph -d tendergraph"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.18"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Install project
        run: uv sync --frozen

      - name: Exercise product persistence against PostgreSQL
        env:
          POSTGRES_DB: tendergraph
          POSTGRES_USER: tendergraph
          POSTGRES_PASSWORD: tendergraph-ci
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: 5432
        run: uv run --frozen python scripts/smoke_product_persistence.py

      - name: Exercise qualification intelligence against PostgreSQL
        env:
          POSTGRES_DB: tendergraph
          POSTGRES_USER: tendergraph
          POSTGRES_PASSWORD: tendergraph-ci
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: 5432
        run: uv run --frozen python scripts/smoke_qualification.py

  container:
    name: Build API image (no publish)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build --tag tendergraph-api:ci .
      - name: Check installed API without model or database
        run: >-
          docker run --rm --network none
          --entrypoint uv tendergraph-api:ci
          run --no-project --python /app/.venv/bin/python --no-sync python -c
          "from fastapi.testclient import TestClient; from tendergraph.api.app import create_app;
          c = TestClient(create_app(use_lifespan=False));
          assert c.get('/').status_code == 200;
          assert c.get('/assets/app.js').status_code == 200;
          assert c.get('/assets/feedback.js').status_code == 200;
          assert c.get('/assets/persistence.js').status_code == 200;
          assert c.get('/assets/qualification.js').status_code == 200;
          assert c.get('/assets/feedback.css').status_code == 200;
          assert c.get('/assets/qualification.css').status_code == 200"
