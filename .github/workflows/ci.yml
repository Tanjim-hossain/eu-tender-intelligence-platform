name: CI

on:
  push:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.18"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Install project
        run: uv sync --frozen

      - name: Run quality gate
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          RAG_PROVIDER: evidence
        run: make check

      - name: Check browser JavaScript syntax
        run: |
          node --check tests/browser/ui_smoke.mjs
          node --check src/tendergraph/api/web/feedback.js
          node --check src/tendergraph/api/web/persistence.js
          node --check src/tendergraph/api/web/auth.js
          node --check src/tendergraph/api/web/qualification.js
          node --check src/tendergraph/api/web/decision.js
          node --check src/tendergraph/api/web/history.js
          node --check src/tendergraph/api/web/app.js
          node --check src/tendergraph/api/web/alerts.js

      - name: Check scheduled refresh shell syntax
        run: |
          bash -n scripts/run_scheduled_refresh.sh
          bash -n scripts/backup_database.sh
          bash -n scripts/restore_database_check.sh

      - name: Verify distribution packaging
        run: make package

      - name: Install free browser test runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.51.1
          npx playwright install --with-deps chromium

      - name: Exercise browser workflow (synthetic API fixtures)
        env:
          TENDERGRAPH_BROWSER_REPORT_DIR: /tmp/tendergraph-browser
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: node tests/browser/ui_smoke.mjs

  persistence:
    name: Product, auth, alerts, decisions, qualification, and document PostgreSQL round trips
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tendergraph
          POSTGRES_USER: tendergraph
          POSTGRES_PASSWORD: tendergraph-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tendergraph -d tendergraph"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.18"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Install project
        run: uv sync --frozen

      - name: Exercise PostgreSQL backup and disposable recovery
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          docker exec "$PG_CONTAINER" psql -v ON_ERROR_STOP=1 -U tendergraph -d tendergraph -c "CREATE TABLE public.restore_probe (id integer PRIMARY KEY, value text NOT NULL); INSERT INTO public.restore_probe VALUES (1, 'restore-check');"
          docker exec "$PG_CONTAINER" pg_dump -U tendergraph -Fc --no-owner --no-acl tendergraph > /tmp/tendergraph-restore-probe.dump
          docker exec -i "$PG_CONTAINER" pg_restore --list < /tmp/tendergraph-restore-probe.dump >/dev/null
          docker exec "$PG_CONTAINER" createdb -U tendergraph restore_check_ci
          docker exec -i "$PG_CONTAINER" pg_restore -U tendergraph --exit-on-error --no-owner --no-acl -d restore_check_ci < /tmp/tendergraph-restore-probe.dump
          test "$(docker exec "$PG_CONTAINER" psql -XAt -U tendergraph -d restore_check_ci -c 'SELECT value FROM public.restore_probe WHERE id=1')" = restore-check
          docker exec "$PG_CONTAINER" dropdb -U tendergraph restore_check_ci
          docker exec "$PG_CONTAINER" psql -v ON_ERROR_STOP=1 -U tendergraph -d tendergraph -c 'DROP TABLE public.restore_probe'
          rm /tmp/tendergraph-restore-probe.dump

      - name: Exercise product persistence against PostgreSQL
        env: &postgres-env
          POSTGRES_DB: tendergraph
          POSTGRES_USER: tendergraph
          POSTGRES_PASSWORD: tendergraph-ci
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: 5432
        run: uv run --frozen python scripts/smoke_product_persistence.py

      - name: Exercise auth account isolation against PostgreSQL
        env: *postgres-env
        run: uv run --frozen python scripts/smoke_auth.py

      - name: Exercise personalized alerts against PostgreSQL
        env: *postgres-env
        run: uv run --frozen python scripts/smoke_alerts.py

      - name: Exercise bid decision review persistence against PostgreSQL
        env: *postgres-env
        run: uv run --frozen python scripts/smoke_decision_dossier.py

      - name: Exercise qualification intelligence against PostgreSQL
        env: *postgres-env
        run: uv run --frozen python scripts/smoke_qualification.py

      - name: Exercise historical procurement intelligence against PostgreSQL
        env: *postgres-env
        run: uv run --frozen python scripts/smoke_history.py

      - name: Exercise document package intelligence against PostgreSQL
        env: *postgres-env
        run: uv run --frozen python scripts/smoke_document_intelligence.py

  container:
    name: Build API image (no publish)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build --tag tendergraph-api:ci .
      - name: Check installed API without model or database
        run: >-
          docker run --rm --network none
          --entrypoint uv tendergraph-api:ci
          run --no-project --python /app/.venv/bin/python --no-sync python -c
          "import shutil; from fastapi.testclient import TestClient; from tendergraph.api.app import create_app;
          c = TestClient(create_app(use_lifespan=False));
          assert shutil.which('pdftotext');
          assert c.get('/').status_code == 200;
          assert c.get('/assets/app.js').status_code == 200;
          assert c.get('/assets/feedback.js').status_code == 200;
          assert c.get('/assets/persistence.js').status_code == 200;
          assert c.get('/assets/auth.js').status_code == 200;
          assert c.get('/assets/auth.css').status_code == 200;
          assert c.get('/assets/qualification.js').status_code == 200;
          assert c.get('/assets/decision.js').status_code == 200;
          assert c.get('/assets/history.js').status_code == 200;
          assert c.get('/assets/decision.css').status_code == 200;
          assert c.get('/assets/alerts.js').status_code == 200;
          assert c.get('/assets/alerts.css').status_code == 200;
          assert c.get('/assets/feedback.css').status_code == 200;
          assert c.get('/assets/qualification.css').status_code == 200"
